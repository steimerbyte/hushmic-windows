[package]
name = "dpdfnet-ladspa"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]   # cdylib for the LADSPA .so; rlib for the test suites

[features]
# The native inference engine (hushmic-denoiser's feature of the same name):
# on by default so every release build of the plugin carries it; which
# engine runs is still decided per model at load time, with ONNX as the
# fallback. `--no-default-features` builds an ONNX-only plugin.
default = ["native"]
native = ["hushmic-denoiser/native"]

[dependencies]
hushmic-denoiser = { path = "../hushmic-denoiser", version = "0.11.0" }
rtrb = "0.4.0"

# The LADSPA host ABI, the realtime-priority requests and the Unix process
# primitives behind them: Linux/Unix only. The portable core (`Processor`)
# is what the Windows EXE drives in-process.
[target.'cfg(unix)'.dependencies]
ladspa = "0.3.4"
libc = "0.2"

[dev-dependencies]
claxon = "0.4" # FLAC decode for the committed public parity fixture

# Self-exec harness: the model paths and the ONNX Runtime commit are
# process-global, so each host case runs in its own subprocess.
[[test]]
name = "host_light_model"
harness = false

# The gap-measuring CLI links libc and the native engine directly: Unix only.
# `required-features` scopes it to the native graph but cannot keep it out of a
# Windows `--all-targets` check (the feature is on by default), and a target
# with `fn main` cannot be cfg-gated away — which is why CI checks `-p hushmic`.
[[example]]
name = "ladder_gap"
required-features = ["native"]
